<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon</title>

    <link rel="canonical" href="https://buctc.org/under-construction">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="construction-page">
        <div class="container construction-content">

            <p class="eyebrow">Coming Soon</p>

            <h1>We're working on it.</h1>

            <p class="construction-text">
                This page is currently under construction.
                Check back soon for updates.
            </p>

            <button type="button" class="button button-red" id="return-previous-page">
                Return to previous page
            </button>

        </div>
    </main>

    <script>
        document.getElementById("return-previous-page").addEventListener("click", () => {
            if (window.history.length > 1) {
                window.history.back();
                return;
            }

            window.location.href = "index.html";
        });
    </script>

</body>
</html>
